<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokyo Mini-Theaters</title>
<style>
  :root { --bg:#170f13; --card:#241820; --pink:#e94b82; --soft:#c98aa8; --gold:#d3a94a; --text:#f4e9e6; --btn:#8a2f52; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans",sans-serif; }
  header { padding:16px 16px 8px; }
  h1 { margin:0; font-size:20px; color:var(--pink); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:0; border-radius:999px; padding:8px 14px; background:var(--card); color:var(--soft); font-size:14px; cursor:pointer; }
  .chip.on { background:var(--btn); color:#fff; font-weight:bold; }
  main { max-width:760px; margin:0 auto; padding:8px 16px 40px; }
  .theater { margin-top:20px; }
  .theater h2 { margin:0 0 8px; font-size:17px; }
  .theater h2 a { color:var(--pink); text-decoration:none; }
  .theater h2 span { color:var(--soft); font-size:13px; font-weight:normal; margin-left:6px; }
  .film { display:flex; gap:12px; background:var(--card); border-radius:10px; padding:10px; margin-bottom:8px; }
  .film img { width:64px; height:90px; object-fit:cover; border-radius:6px; flex:none; background:var(--btn); }
  .noimg { width:64px; height:90px; border-radius:6px; flex:none; background:var(--btn); display:flex; align-items:center; justify-content:center; font-size:24px; }
  .title { font-weight:bold; font-size:16px; }
  .title a { color: var(--text); text-decoration: none; }
  .title a:hover { color: var(--pink); }
  .info { color:#999; font-size:12px; margin-top:2px; }
  .times { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .times b { background:#2f2128; color:var(--gold); border-radius:6px; padding:4px 9px; font-size:15px; }
  .empty { text-align:center; color:#999; margin-top:48px; }

  @media (max-width: 480px) {
    .film img, .noimg { width: 54px; height: 76px; }
    .title { font-size: 15px; }
    .times b { font-size: 14px; padding: 3px 7px; }
  }
</style>
</head>
<body>
<header><h1>Tokyo Mini-Theaters</h1></header>
<div class="chips" id="dates"></div>
<div class="chips" id="areas"></div>
<main id="out"><div class="empty">Loading…</div></main>

<script>
  // Replace with your actual Apps Script Web App URL (ending in /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbwAgz2vJvYtR2yn8gEIatL-ki7aNq5HvgGmPLiwIN5AxTQljpXu9NNAQiAvV66FOHYH/exec';

  var DATA = null, selDate = null, selArea = 'All';
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function addDays(key, n) {
    var p = key.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.toISOString().slice(0, 10);
  }
  function label(key) {
    var p = key.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return p[1] + '/' + p[2] + ' (' + DOW[d.getUTCDay()] + ')';
  }

  function render() {
    var dates = [];
    for (var i = 0; i < 7; i++) dates.push(addDays(DATA.today, i));
    document.getElementById('dates').innerHTML = dates.map(function (d) {
      return '<button class="chip' + (d === selDate ? ' on' : '') + '" data-date="' + d + '">' +
        (d === DATA.today ? 'Today' : label(d)) + '</button>';
    }).join('');

    var areas = ['All'];
    DATA.theaters.forEach(function (t) { if (areas.indexOf(t.area) < 0) areas.push(t.area); });
    document.getElementById('areas').innerHTML = areas.map(function (a) {
      return '<button class="chip' + (a === selArea ? ' on' : '') + '" data-area="' + esc(a) + '">' + esc(a) + '</button>';
    }).join('');

    var html = '';
    DATA.theaters.forEach(function (t) {
      if (selArea !== 'All' && t.area !== selArea) return;
      var films = t.films.filter(function (f) { return f.times && f.times[selDate] && f.times[selDate].length; })
        .sort(function (a, b) { return a.times[selDate][0].localeCompare(b.times[selDate][0]); });
      if (!films.length) return;
      html += '<section class="theater"><h2><a href="' + esc(t.url) + '" target="_blank" rel="noopener">' + esc(t.name) +
        '</a><span>' + esc(t.area) + '</span></h2>';
      films.forEach(function (f) {
        var titleHtml = f.url 
          ? '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.title) + '</a>' 
          : esc(f.title);

        html += '<div class="film">' +
          (f.poster ? '<img loading="lazy" src="' + esc(f.poster) + '" alt="">' : '<div class="noimg">🎞️</div>') +
          '<div><div class="title">' + titleHtml + '</div>' +
          (f.info ? '<div class="info">' + esc(f.info) + '</div>' : '') +
          '<div class="times">' + f.times[selDate].map(function (x) { return '<b>' + esc(x) + '</b>'; }).join('') + '</div>' +
          '</div></div>';
      });
      html += '</section>';
    });
    document.getElementById('out').innerHTML = html || '<div class="empty">No screenings found.</div>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    if (b.dataset.date) selDate = b.dataset.date;
    if (b.dataset.area) selArea = b.dataset.area;
    render();
  });

  fetch(API_URL)
    .then(function (res) { return res.json(); })
    .then(function (d) { DATA = d; selDate = d.today; render(); })
    .catch(function (err) {
      document.getElementById('out').innerHTML = '<div class="empty">Error loading schedule data.</div>';
    });
</script>
</body>
</html>
